<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WestCulture | Genuine Entertainment Reports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    
    <!-- Firebase Web SDK (v9 Compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            /* WSJ / NYT Elite Dark Newsroom Palette */
            --bg-main: #121212;        /* Deep Editorial Charcoal */
            --bg-card: #1c1c1e;        /* Subtle Elevated Surface */
            --bg-elevated: #262629;    /* Card Item Fill */
            --accent-editorial: #e2e8f0;/* Crisp News White/Silver */
            --accent-gold: #d4af37;    /* Classic Muted Editorial Gold */
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #2c2c2e;
            --font-display: 'Playfair Display', Georgia, serif; 
            --font-body: 'Inter', -apple-system, sans-serif;
        }

        * { box-sizing: border-box; font-family: var(--font-body); margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-primary); padding: 16px; min-height: 100vh; padding-bottom: 80px; }
        .container { max-width: 480px; margin: 0 auto; }

        /* Top Bar & User Profile */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .user-status { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
        .btn-auth { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        /* Header Layout (Classic Masthead Style) */
        .brand-header { padding: 16px 0 20px 0; border-bottom: 2px solid var(--text-primary); margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 34px; height: 34px; background: var(--text-primary); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 20px; height: 20px; fill: var(--bg-main); }
        
        .logo-text { font-family: var(--font-display); font-size: 28px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; text-transform: uppercase; }
        .logo-text span { font-style: italic; color: #d4af37; }

        .badge-sub { font-family: var(--font-display); font-style: italic; color: var(--text-secondary); font-size: 11px; letter-spacing: 0.5px; text-align: center; }

        /* Leaderboard */
        .radar-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 18px; margin-bottom: 20px; }
        .radar-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .radar-title::before { content: ''; width: 3px; height: 12px; background: var(--accent-gold); border-radius: 1px; }

        .radar-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-elevated); padding: 12px 14px; border-radius: 6px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.02); }
        .rank { font-family: var(--font-display); font-size: 16px; font-weight: 900; color: var(--accent-gold); width: 36px; flex-shrink: 0; }
        .celeb-info { flex: 1; margin-left: 4px; }
        .celeb-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--text-primary); line-height: 1.2; }
        .celeb-tag { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .mentions-badge { font-size: 10px; font-weight: 700; color: var(--accent-gold); background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.2); padding: 4px 8px; border-radius: 4px; flex-shrink: 0; }

        /* Categories */
        .categories { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; border-bottom: 1px solid var(--border-color); }
        .categories::-webkit-scrollbar { display: none; }
        .cat-chip { background: transparent; color: var(--text-secondary); padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; border: 1px solid transparent; }
        .cat-chip.active { background: var(--bg-card); color: var(--text-primary); border-color: var(--border-color); }

        /* Cards */
        .featured-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .card-banner { width: 100%; height: 200px; object-fit: cover; display: block; border-bottom: 1px solid var(--border-color); }
        .card-img-placeholder { height: 180px; background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 22px; font-family: var(--font-display); font-weight: 700; border-bottom: 1px solid var(--border-color); text-transform: uppercase; letter-spacing: 2px; }
        .card-body { padding: 18px; cursor: pointer; }
        .meta-tag { font-size: 11px; text-transform: uppercase; color: var(--accent-gold); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; display: inline-block; }
        .card-title { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.25; color: var(--text-primary); margin-bottom: 10px; }
        .card-snippet { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 14px; }

        /* Engagement Bar */
        .engagement-bar { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); padding: 12px 18px; background: rgba(0,0,0,0.2); }
        .action-btn { background: none; border: none; color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .action-btn svg { width: 16px; height: 16px; fill: currentColor; }

        /* Modals */
        .article-view, .publisher-modal, .share-modal { display: none; background: var(--bg-main); position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; padding: 20px; overflow-y: auto; }
        .share-modal { background: rgba(0,0,0,0.85); display: none; align-items: flex-end; justify-content: center; z-index: 200; padding: 0; }
        .share-sheet { background: var(--bg-card); width: 100%; max-width: 480px; border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 24px; border-top: 1px solid var(--border-color); }

        .share-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 20px 0; text-align: center; }
        .share-item { background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 8px; cursor: pointer; color: var(--text-primary); font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .share-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; }

        .btn-back { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-bottom: 20px; cursor: pointer; }
        .article-title { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.2; margin-bottom: 12px; }
        .article-content p { font-size: 15px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 16px; }

        .comments-section { margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .comment-item { background: var(--bg-card); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
        .comment-user { font-weight: 700; color: var(--accent-gold); font-size: 11px; margin-bottom: 4px; }

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; background: #000; border-radius: 6px; margin: 16px 0; border: 1px solid var(--border-color); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Form Controls */
        .fab-btn { position: fixed; bottom: 20px; right: 20px; background: var(--text-primary); color: var(--bg-main); border: none; padding: 12px 18px; border-radius: 4px; font-size: 13px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 90; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: var(--accent-gold); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
        input, select, textarea { width: 100%; padding: 12px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-primary); font-size: 14px; outline: none; }
        textarea { height: 120px; resize: none; }
        .btn-publish { width: 100%; background: var(--text-primary); color: var(--bg-main); border: none; padding: 14px; border-radius: 4px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="user-status" id="user-display">Guest User</div>
        <button class="btn-auth" id="auth-btn" onclick="handleGoogleSignIn()">
            <svg style="width:14px; height:14px; fill:currentColor;" viewBox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
            Sign In with Google
        </button>
    </div>

    <div class="brand-header">
        <div class="logo-box">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M2.5 4.5L7.5 19.5L12 8.5L16.5 19.5L21.5 4.5H17.5L14.5 14.5L12 8.5L9.5 14.5L6.5 4.5H2.5Z"/>
                </svg>
            </div>
            <div class="logo-text">WEST<span>CULTURE</span></div>
        </div>
        <div class="badge-sub">The Global Standard in Entertainment Chronicle</div>
    </div>

    <div class="radar-card">
        <!-- Changed to font-weight: 700 to match the rest of the section header text -->
        <div class="radar-title" style="font-weight: 700; font-size: 13px;">WESTCULTURE TOP 100 (LIVE RANKING)</div>
        <div id="radar-list"></div>
    </div>

    <div class="categories">
        <div class="cat-chip active" onclick="filterCategory('All Feed', this)">All Feed</div>
        <div class="cat-chip" onclick="filterCategory('Celeb Gossip', this)">Celeb Gossip</div>
        <div class="cat-chip" onclick="filterCategory('Music & Drops', this)">Music & Drops</div>
        <div class="cat-chip" onclick="filterCategory('Viral Trends', this)">Viral Trends</div>
    </div>

    <div id="article-feed"></div>
</div>

<button class="fab-btn" onclick="openPublisher()">+ Publish Post</button>

<!-- Article Reader Modal -->
<div class="article-view" id="reader">
    <div class="container">
        <button class="btn-back" onclick="closeArticle()">← Back to Feed</button>
        <div id="reader-body"></div>
        
        <div class="comments-section">
            <h3 style="font-family: var(--font-display); margin-bottom: 12px; font-size: 16px;">Comments</h3>
            <div id="comments-list"></div>
            <div style="display: flex; gap: 8px; margin-top: 12px;">
                <input type="text" id="comment-input" placeholder="Add a comment...">
                <button onclick="submitComment()" style="background: var(--text-primary); color: var(--bg-main); border: none; padding: 0 16px; border-radius: 4px; font-weight: 700; cursor: pointer;">Post</button>
            </div>
        </div>
    </div>
</div>

<!-- Social Share Sheet Modal -->
<div class="share-modal" id="share-modal" onclick="closeShareModal(event)">
    <div class="share-sheet">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="font-family: var(--font-display); font-size: 18px;">Share Story</h3>
            <span onclick="document.getElementById('share-modal').style.display='none'" style="cursor: pointer; font-size: 18px; color: var(--text-secondary);">✕</span>
        </div>
        <p style="font-size: 12px; color: var(--text-secondary);" id="share-title-preview"></p>
        <div class="share-grid">
            <div class="share-item" onclick="shareToSocial('whatsapp')">
                <div class="share-icon" style="background: #25D366;">WA</div>
                WhatsApp
            </div>
            <div class="share-item" onclick="shareToSocial('x')">
                <div class="share-icon" style="background: #000000; border: 1px solid #333;">𝕏</div>
                X (Twitter)
            </div>
            <div class="share-item" onclick="shareToSocial('instagram')">
                <div class="share-icon" style="background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);">IG</div>
                Instagram
            </div>
            <div class="share-item" onclick="shareToSocial('copy')">
                <div class="share-icon" style="background: #475569;">🔗</div>
                Copy Link
            </div>
        </div>
    </div>
</div>

<!-- Publisher Modal -->
<div class="publisher-modal" id="publisher">
    <div class="container">
        <button class="btn-back" onclick="closePublisher()">← Cancel</button>
        <h2 style="font-family: var(--font-display); margin-bottom: 20px; color: var(--accent-gold);">Publish to WestCulture</h2>
        
        <div class="form-group">
            <label>Headline</label>
            <input type="text" id="p-title" placeholder="e.g. Burna Boy Drops New Visuals">
        </div>

        <div class="form-group">
            <label>Artist Tagged (For Top 100 Rank)</label>
            <input type="text" id="p-artist" placeholder="e.g. Burna Boy, Wizkid, Davido">
        </div>

        <div class="form-group">
            <label>Category</label>
            <select id="p-category">
                <option value="Celeb Gossip">Celeb Gossip</option>
                <option value="Music & Drops">Music & Drops</option>
                <option value="Viral Trends">Viral Trends</option>
            </select>
        </div>

        <div class="form-group">
            <label>Image URL (Optional)</label>
            <input type="text" id="p-imgurl" placeholder="Paste direct image link (https://...)">
        </div>

        <div class="form-group">
            <label>Banner Text Fallback</label>
            <input type="text" id="p-img" placeholder="e.g. BREAKING NEWS">
        </div>

        <div class="form-group">
            <label>Short Snippet</label>
            <input type="text" id="p-snippet" placeholder="e.g. Reaches 1M views in 2 hours.">
        </div>

        <div class="form-group">
            <label>Full Story (Paste YouTube link directly here)</label>
            <textarea id="p-content" placeholder="Write story or paste YouTube URL directly..."></textarea>
        </div>

        <button class="btn-publish" onclick="saveArticle()">Publish Story</button>
    </div>
</div>

<script>
// Firebase Configuration
const firebaseConfig = {
    apiKey: "AIzaSyAlI8WcqYVWE1EbMO5XxQuyExnBNJ3AS2I",
    authDomain: "westculture-9d558.firebaseapp.com",
    projectId: "westculture-9d558",
    storageBucket: "westculture-9d558.firebasestorage.app",
    messagingSenderId: "82084479264",
    appId: "1:82084479264:web:9ef6b5e187ea6560429745"
};

if (typeof firebase !== 'undefined') {
    firebase.initializeApp(firebaseConfig);
}

const defaultArticles = [
    {
        id: 'art-1',
        title: 'Burna Boy Selling Out 80k-Capacity Stadium in Record Time',
        artist: 'Burna Boy',
        category: 'Music & Drops',
        imageUrl: '',
        imgTag: 'SOLD OUT',
        snippet: 'Ticket sales hit a new record within 20 minutes of drop across international box offices.',
        content: 'Burna Boy continues his massive worldwide tour run, setting unprecedented ticket sales numbers across international venues.',
        likes: 124,
        shares: 45,
        comments: [{ user: 'Fan99', text: 'Odogwu no be guy name!' }],
        date: 'Aug 2026'
    }
];

let activeArticleId = null;
let currentFilter = 'All Feed';
let currentUserDisplayName = null;
let sharingArticleTitle = '';

// Google Sign-In Function
function handleGoogleSignIn() {
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithRedirect(provider).catch((error) => {
        alert("Sign-in failed: " + error.message);
    });
}

function updateAuthUI(name) {
    if (name) {
        document.getElementById('user-display').innerText = name;
        document.getElementById('auth-btn').innerText = '✓ Signed In';
        document.getElementById('auth-btn').onclick = null;
    }
}

if (typeof firebase !== 'undefined' && firebase.auth) {
    firebase.auth().getRedirectResult().then((result) => {
        if (result.user) {
            currentUserDisplayName = result.user.displayName || result.user.email.split('@')[0];
            updateAuthUI(currentUserDisplayName);
        }
    }).catch((error) => { console.log(error.message); });

    firebase.auth().onAuthStateChanged((user) => {
        if (user) {
            currentUserDisplayName = user.displayName || user.email.split('@')[0];
            updateAuthUI(currentUserDisplayName);
        }
    });
}

function formatEmbeds(text) {
    const ytRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/g;
    return text.replace(ytRegex, (match, id) => `<div class="video-container"><iframe src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe></div>`);
}

function getArticles() {
    let stored = localStorage.getItem('westculture_articles');
    if (!stored) {
        localStorage.setItem('westculture_articles', JSON.stringify(defaultArticles));
        return defaultArticles;
    }
    return JSON.parse(stored);
}

function saveArticles(list) {
    localStorage.setItem('westculture_articles', JSON.stringify(list));
    renderFeed();
    updateLeaderboard();
}

function updateLeaderboard() {
    const articles = getArticles();
    const scores = {};

    articles.forEach(art => {
        if (!art.artist) return;
        const totalEngagement = (art.likes || 0) + (art.shares || 0) * 2 + (art.comments ? art.comments.length : 0) * 3 + 10;
        scores[art.artist] = (scores[art.artist] || 0) + totalEngagement;
    });

    const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]).slice(0, 3);
    const radar = document.getElementById('radar-list');
    radar.innerHTML = '';

    sorted.forEach((artist, index) => {
        radar.innerHTML += `
            <div class="radar-item">
                <div class="rank">#${index + 1}</div>
                <div class="celeb-info">
                    <div class="celeb-name">${artist}</div>
                    <div class="celeb-tag">Live Trending Record</div>
                </div>
                <div class="mentions-badge">${scores[artist]} Points</div>
            </div>
        `;
    });
}

function renderFeed() {
    const list = getArticles();
    const feed = document.getElementById('article-feed');
    feed.innerHTML = '';

    const filtered = currentFilter === 'All Feed' ? list : list.filter(a => a.category === currentFilter);

    filtered.forEach(art => {
        let mediaHeader = art.imageUrl ? 
            `<img src="${art.imageUrl}" class="card-banner" alt="Article image">` : 
            `<div class="card-img-placeholder">${art.imgTag || 'WESTCULTURE'}</div>`;

        feed.innerHTML += `
            <div class="featured-card">
                ${mediaHeader}
                <div class="card-body" onclick="openArticle('${art.id}')">
                    <span class="meta-tag">${art.category}</span>
                    <h2 class="card-title">${art.title}</h2>
                    <p class="card-snippet">${art.snippet}</p>
                </div>
                <div class="engagement-bar">
                    <button class="action-btn" onclick="toggleLike('${art.id}')">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span>${art.likes || 0}</span>
                    </button>
                    <button class="action-btn" onclick="openArticle('${art.id}')">
                        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                        <span>${art.comments ? art.comments.length : 0}</span>
                    </button>
                    <button class="action-btn" onclick="openShareModal('${art.id}')">
                        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                        Share
                    </button>
                </div>
            </div>
        `;
    });
}

function toggleLike(id) {
    const list = getArticles();
    const art = list.find(a => a.id === id);
    if (art) {
        art.likes = (art.likes || 0) + 1;
        saveArticles(list);
    }
}

function openShareModal(id) {
    const list = getArticles();
    const art = list.find(a => a.id === id);
    if (art) {
        activeArticleId = id;
        sharingArticleTitle = art.title;
        document.getElementById('share-title-preview').innerText = art.title;
        document.getElementById('share-modal').style.display = 'flex';
    }
}

function closeShareModal(e) {
    if (e.target.id === 'share-modal') {
        document.getElementById('share-modal').style.display = 'none';
    }
}

function shareToSocial(platform) {
    const shareUrl = window.location.href;
    const text = encodeURIComponent("Check out this story on WestCulture: " + sharingArticleTitle);
    
    if (platform === 'whatsapp') {
        window.open(`https://api.whatsapp.com/send?text=${text}%20${encodeURIComponent(shareUrl)}`, '_blank');
    } else if (platform === 'x') {
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${encodeURIComponent(shareUrl)}`, '_blank');
    } else if (platform === 'instagram') {
        navigator.clipboard.writeText(shareUrl);
        alert('Link copied! You can now paste it directly into your Instagram story or DM.');
    } else if (platform === 'copy') {
        navigator.clipboard.writeText(shareUrl);
        alert('Link copied to clipboard!');
    }

    const list = getArticles();
    const art = list.find(a => a.id === activeArticleId);
    if (art) {
        art.shares = (art.shares || 0) + 1;
        saveArticles(list);
    }
    document.getElementById('share-modal').style.display = 'none';
}

function filterCategory(cat, el) {
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    currentFilter = cat;
    renderFeed();
}

function openArticle(id) {
    activeArticleId = id;
    const list = getArticles();
    const art = list.find(a => a.id === id);
    if (!art) return;

    document.getElementById('reader-body').innerHTML = `
        <span class="meta-tag">${art.category}</span>
        <h1 class="article-title">${art.title}</h1>
        ${art.imageUrl ? `<img src="${art.imageUrl}" style="width:100%; border-radius:6px; margin-bottom:16px;">` : ''}
        <div class="article-content"><p>${art.content}</p></div>
    `;

    renderComments(art);
    document.getElementById('reader').style.display = 'block';
}

function renderComments(art) {
    const cList = document.getElementById('comments-list');
    cList.innerHTML = '';
    if (!art.comments || art.comments.length === 0) {
        cList.innerHTML = '<div style="font-size:12px; color:var(--text-secondary);">No comments yet.</div>';
        return;
    }
    art.comments.forEach(c => {
        cList.innerHTML += `
            <div class="comment-item">
                <div class="comment-user">${c.user}</div>
                <div>${c.text}</div>
            </div>
        `;
    });
}

function submitComment() {
    const text = document.getElementById('comment-input').value;
    const author = currentUserDisplayName || 'Guest_' + Math.floor(Math.random() * 899 + 100);
    if (!text || !activeArticleId) return;

    const list = getArticles();
    const art = list.find(a => a.id === activeArticleId);
    if (art) {
        if (!art.comments) art.comments = [];
        art.comments.push({ user: author, text });
        document.getElementById('comment-input').value = '';
        saveArticles(list);
        renderComments(art);
    }
}

function closeArticle() { document.getElementById('reader').style.display = 'none'; }
function openPublisher() { document.getElementById('publisher').style.display = 'block'; }
function closePublisher() { document.getElementById('publisher').style.display = 'none'; }

function saveArticle() {
    const title = document.getElementById('p-title').value;
    const artist = document.getElementById('p-artist').value;
    const category = document.getElementById('p-category').value;
    const imageUrl = document.getElementById('p-imgurl').value;
    const imgTag = document.getElementById('p-img').value;
    const snippet = document.getElementById('p-snippet').value;
    let rawContent = document.getElementById('p-content').value;

    if (!title || !snippet || !rawContent) {
        alert("Please complete required fields.");
        return;
    }

    const newArt = {
        id: 'art-' + Date.now(),
        title,
        artist: artist || 'Afrobeats',
        category,
        imageUrl,
        imgTag: imgTag || 'WESTCULTURE',
        snippet,
        content: formatEmbeds(rawContent.replace(/\n/g, '<br>')),
        likes: 0,
        shares: 0,
        comments: [],
        date: 'Aug 2026'
    };

    const list = getArticles();
    list.unshift(newArt);
    saveArticles(list);

    document.getElementById('p-title').value = '';
    document.getElementById('p-artist').value = '';
    document.getElementById('p-imgurl').value = '';
    document.getElementById('p-img').value = '';
    document.getElementById('p-snippet').value = '';
    document.getElementById('p-content').value = '';

    closePublisher();
}

renderFeed();
updateLeaderboard();
</script>
